<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时序训练台 · 包装线-01</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<!-- 图标 sprite：内联在文档里，file:// 下也能用（图标字体会被 CORS 拦掉）。 -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13.5 3 5.5 13.5h6L10.5 21l8-10.5h-6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 21 20H3z"/><path d="M12 10v5"/><path d="M12 17.4h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11.2v5.3"/><path d="M12 7.8h.01"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7l.9 12.1A1.5 1.5 0 0 0 8.9 20.5h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10.5 10.8v6"/><path d="M13.5 10.8v6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16.2V4.8"/><path d="M7.6 9.2 12 4.8l4.4 4.4"/><path d="M4.6 15.4v2.6A1.5 1.5 0 0 0 6.1 19.5h11.8a1.5 1.5 0 0 0 1.5-1.5v-2.6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
  <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M11.5 6.2 4.8 12l6.7 5.8z"/><path d="M19.2 6.2 12.5 12l6.7 5.8z"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M12.5 6.2 19.2 12l-6.7 5.8z"/><path d="M4.8 6.2 11.5 12l-6.7 5.8z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2 18.2 12 7.5 18.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.2 5.5v13"/><path d="M14.8 5.5v13"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14"/><path d="M16 5v14"/><path d="M3 12h18"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.4 3.5h5.2"/><path d="M10.4 3.5v6.1l-4.8 8.3a1.9 1.9 0 0 0 1.6 2.9h9.6a1.9 1.9 0 0 0 1.6-2.9l-4.8-8.3V3.5"/><path d="M7.6 15.2h8.8"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5 17.5 17.5"/><path d="M17.5 6.5 6.5 17.5"/></symbol>
</svg>

<div class="app">

  <header class="topbar">
    <span class="brand">
      <svg class="ico" width="16" height="16" aria-hidden="true"><use href="#i-flask" xlink:href="#i-flask"/></svg>
      <span class="brand-name">时序训练台</span>
    </span>
    <nav class="crumbs" id="crumbs" aria-label="当前位置"></nav>
    <div class="topbar-end">
      <!-- 现在看的是真工程的还是示例数据，必须在顶栏上说清楚，别让改动石沉大海。 -->
      <span class="badge" id="src-tag"></span>
      <!-- 全站唯一的任务条：抽取特征和训练共用，停止入口也只有这一个。 -->
      <div class="jobbar is-idle" id="jobbar" role="status" aria-live="polite"></div>
    </div>
  </header>

  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="工程步骤"></nav>
    <main class="work" id="view-host"></main>
    <aside class="inspector" id="inspector" aria-label="这一步的说明"></aside>
  </div>

</div>

<div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>

<noscript>
  <div class="dialog" style="margin:48px auto">
    <h2>需要打开 JavaScript</h2>
    <p>这个页面全部在本地浏览器里跑，不联网、不装东西，但需要 JavaScript 才能显示内容。</p>
  </div>
</noscript>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="app/dom.js"></script>
<script src="app/sample-data.js"></script>
<!-- api 与 live 必须在 shell 之前：页面由训练台托管时，live.boot() 会先拉真实工程，
     成功就整体换掉 sample-data，失败就留着示例数据并在顶栏写明原因。 -->
<script src="app/api.js"></script>
<script src="app/live.js"></script>
<script src="app/charts.js"></script>
<script src="app/shell.js"></script>
<script src="app/view-home.js"></script>
<script src="app/view-model.js"></script>
<script src="app/view-data.js"></script>
<script src="app/view-annotate.js"></script>
<script src="app/view-features.js"></script>
<script src="app/view-train.js"></script>
<script src="app/view-runs.js"></script>
<script src="app/main.js"></script>
</body>
</html>
